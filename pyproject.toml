[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quota"
version = "0.1.0"
description = "Unified AI quota/usage CLI for Codex, GitHub Copilot, and Claude"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "shichirouji21" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "build"]

[project.urls]
Homepage = "https://github.com/shichirouji21/ai-quota"

[project.scripts]
ai-quota = "ai_quota.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
